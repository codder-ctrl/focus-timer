<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #7a746b;
    --line: #e6e1d8;
    --accent: #d9572b;
    --track: #efe9df;
  }
  :root[data-mode="short"] { --accent: #2f8f6b; }
  :root[data-mode="long"]  { --accent: #3b6fd1; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --card: #201f1c;
      --text: #f1ede6;
      --muted: #9b958b;
      --line: #33302b;
      --track: #2c2a26;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    transition: background .3s;
  }
  main { width: 100%; max-width: 440px; }

  .modes {
    display: flex; gap: 4px; padding: 4px;
    background: var(--track); border-radius: 999px; margin-bottom: 28px;
  }
  .modes button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 8px 0; border-radius: 999px; cursor: pointer;
  }
  .modes button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .08); }

  .ring { position: relative; width: 280px; max-width: 100%; aspect-ratio: 1; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--track); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .time { font-size: 64px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .current { font-size: 14px; color: var(--muted); max-width: 70%; text-align: center;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls { display: flex; justify-content: center; gap: 12px; margin: 24px 0 8px; }
  .controls button {
    font: inherit; border-radius: 999px; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 10px 18px; font-size: 14px;
  }
  .controls .primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; min-width: 120px; transition: background .3s;
  }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 28px; }
  kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .tasks { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .tasks h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  form input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  form button { font: inherit; font-size: 14px; border: 0; border-radius: 10px; padding: 0 14px;
                background: var(--text); color: var(--bg); cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }
  li:hover { background: var(--track); }
  li.active { outline: 2px solid var(--accent); outline-offset: -2px; }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  li .label { flex: 1; overflow-wrap: anywhere; }
  li .count { font-size: 12px; color: var(--muted); }
  li input { accent-color: var(--accent); width: 16px; height: 16px; }
  li .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .empty { font-size: 13px; color: var(--muted); padding: 8px; }
</style>
</head>
<body>
<main>
  <div class="modes" role="tablist">
    <button data-mode="focus" class="on">Focus</button>
    <button data-mode="short">Short break</button>
    <button data-mode="long">Long break</button>
  </div>

  <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"/>
      <circle class="bar" id="bar" cx="60" cy="60" r="54"/>
    </svg>
    <div class="center">
      <div class="time" id="time">25:00</div>
      <div class="current" id="current">Pick a task below</div>
    </div>
  </div>

  <div class="controls">
    <button id="reset" title="Reset (R)">Reset</button>
    <button id="toggle" class="primary">Start</button>
    <button id="skip" title="Skip (S)">Skip</button>
  </div>
  <div class="hint"><kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>S</kbd> skip</div>

  <div class="stats">
    <div class="stat"><b id="today">0</b><span>sessions today</span></div>
    <div class="stat"><b id="minutes">0</b><span>focus min today</span></div>
    <div class="stat"><b id="streak">0</b><span>day streak 🔥</span></div>
  </div>

  <section class="tasks">
    <h2>Tasks</h2>
    <form id="form">
      <input id="newTask" placeholder="What are you working on?" autocomplete="off">
      <button>Add</button>
    </form>
    <ul id="list"></ul>
  </section>
</main>

<script>
const DURATIONS = { focus: 25, short: 5, long: 15 }; // minutes
const LONG_EVERY = 4;
const KEY = 'focus-timer-v1';
const CIRC = 2 * Math.PI * 54;

const $ = id => document.getElementById(id);
const bar = $('bar');
bar.style.strokeDasharray = CIRC;

// ---- persisted state ----
const todayKey = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
let data = { tasks: [], activeId: null, days: {} }; // days: { 'YYYY-MM-DD': { sessions, minutes } }
try { Object.assign(data, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };

// ---- timer state ----
let mode = 'focus';
let total = DURATIONS.focus * 60 * 1000;
let remaining = total;
let endAt = null;      // timestamp when running, null when paused
let tick = null;
let focusCount = 0;    // completed focus sessions this page visit, for long-break cadence

function fmt(ms) {
  const s = Math.ceil(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function render() {
  const t = fmt(remaining);
  $('time').textContent = t;
  bar.style.strokeDashoffset = CIRC * (remaining / total);
  $('toggle').textContent = endAt ? 'Pause' : (remaining < total ? 'Resume' : 'Start');
  const label = { focus: 'Focus', short: 'Break', long: 'Long break' }[mode];
  document.title = endAt ? `${t} · ${label}` : 'Focus Timer';
}

function setMode(m) {
  pause();
  mode = m;
  document.documentElement.dataset.mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  total = remaining = DURATIONS[m] * 60 * 1000;
  render();
}

function start() {
  if (endAt) return;
  unlockAudio();
  endAt = Date.now() + remaining;
  tick = setInterval(() => {
    remaining = Math.max(0, endAt - Date.now());
    if (remaining === 0) finish(); else render();
  }, 250);
  render();
}

function pause() {
  if (!endAt) return;
  remaining = Math.max(0, endAt - Date.now());
  endAt = null;
  clearInterval(tick);
  render();
}

function finish(skipped = false) {
  pause();
  if (mode === 'focus' && !skipped) {
    const d = data.days[todayKey()] ||= { sessions: 0, minutes: 0 };
    d.sessions++;
    d.minutes += DURATIONS.focus;
    const task = data.tasks.find(t => t.id === data.activeId);
    if (task) task.pomos = (task.pomos || 0) + 1;
    save();
    renderStats();
    renderTasks();
    focusCount++;
  }
  if (!skipped) chime();
  setMode(mode === 'focus' ? (!skipped && focusCount % LONG_EVERY === 0 ? 'long' : 'short') : 'focus');
}

// ---- sound ----
let audio;
function unlockAudio() {
  try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
}
function chime() {
  if (!audio) return;
  [659.25, 783.99, 1046.5].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    const t = audio.currentTime + i * 0.18;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.85);
  });
}

// ---- stats ----
function renderStats() {
  const d = data.days[todayKey()] || { sessions: 0, minutes: 0 };
  $('today').textContent = d.sessions;
  $('minutes').textContent = d.minutes;
  // streak: consecutive days with ≥1 session, ending today (or yesterday if none yet today)
  let streak = 0;
  const day = new Date();
  if (!data.days[todayKey()]) day.setDate(day.getDate() - 1);
  while (data.days[day.toLocaleDateString('en-CA')]?.sessions) {
    streak++;
    day.setDate(day.getDate() - 1);
  }
  $('streak').textContent = streak;
}

// ---- tasks ----
function renderTasks() {
  const list = $('list');
  list.innerHTML = '';
  if (!data.tasks.length) list.innerHTML = '<div class="empty">No tasks yet. Add one and click it to focus on it.</div>';
  for (const t of data.tasks) {
    const li = document.createElement('li');
    li.className = (t.done ? 'done ' : '') + (t.id === data.activeId ? 'active' : '');
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}><span class="label"></span>
      <span class="count">${t.pomos ? '🍅×' + t.pomos : ''}</span><button class="del" title="Delete">×</button>`;
    li.querySelector('.label').textContent = t.text;
    li.onclick = e => {
      if (e.target.matches('input')) { t.done = e.target.checked; }
      else if (e.target.matches('.del')) {
        data.tasks = data.tasks.filter(x => x !== t);
        if (data.activeId === t.id) data.activeId = null;
      } else { data.activeId = data.activeId === t.id ? null : t.id; }
      save(); renderTasks();
    };
    list.appendChild(li);
  }
  const active = data.tasks.find(t => t.id === data.activeId);
  $('current').textContent = active ? active.text : 'Pick a task below';
}

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('newTask').value.trim();
  if (!text) return;
  const id = Date.now().toString(36);
  data.tasks.push({ id, text, done: false, pomos: 0 });
  if (!data.activeId) data.activeId = id;
  $('newTask').value = '';
  save(); renderTasks();
};

// ---- wiring ----
$('toggle').onclick = () => endAt ? pause() : start();
$('reset').onclick = () => setMode(mode);
$('skip').onclick = () => finish(true);
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return; // leave browser shortcuts like Ctrl+S alone
  if (e.repeat) return; // holding a key down shouldn't toggle start/pause over and over
  const key = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); $('toggle').click(); }
  else if (key === 'r') $('reset').click();
  else if (key === 's') $('skip').click();
});

setMode('focus');
renderStats();
renderTasks();
</script>
</body>
</html>
